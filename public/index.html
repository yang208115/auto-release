<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Release Writer</title>
  <meta name="description" content="使用 AI 从 GitHub 提交自动生成专业的发布说明。">
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="__variable_188709 __variable_9a8899 antialiased bg-gray-50 dark:bg-zinc-950">
  <main class="min-h-screen p-4 md:p-8 max-w-5xl mx-auto bg-transparent text-gray-900 dark:text-gray-100 font-sans">

    <header
      class="mb-8 p-6 sm:p-10 bg-gradient-to-br from-zinc-100 to-zinc-200 dark:from-zinc-900 dark:to-zinc-800 rounded-2xl shadow-sm border border-zinc-200 dark:border-zinc-700">
      <h1
        class="text-3xl sm:text-4xl font-extrabold mb-3 tracking-tight bg-gradient-to-r from-blue-500 to-green-400 bg-clip-text text-transparent">
        GitHub Release Writer</h1>
      <p class="text-md sm:text-lg text-zinc-600 dark:text-zinc-400">使用 AI 自动从 GitHub 提交记录生成专业的发布说明。</p>
    </header>

    <div class="space-y-6">

      <!-- 配置选项 -->
      <details class="group p-4 border rounded-lg shadow-sm bg-white dark:bg-zinc-900 mb-6">
        <summary
          class="text-xl font-bold flex items-center gap-2 cursor-pointer list-none select-none hover:text-blue-500 transition-colors [&::-webkit-details-marker]:hidden">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-key w-5 h-5">
            <path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"></path>
            <path d="m21 2-9.6 9.6"></path>
            <circle cx="7.5" cy="15.5" r="5.5"></circle>
          </svg>
          配置选项
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="2"
            class="w-5 h-5 ml-auto transition-transform duration-300 group-open:rotate-180 text-gray-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </summary>
        <form id="settingsForm" class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-800">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">GitHub Token (用于增加 API 限额)</label>
              <input id="githubToken" type="password"
                class="w-full border border-gray-300 dark:border-gray-700 p-2 rounded text-black dark:text-white bg-transparent"
                placeholder="ghp_...">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">AI 提供商</label>
              <select id="aiProvider"
                class="w-full border border-gray-300 dark:border-gray-700 p-2 rounded text-black dark:text-white bg-transparent outline-none">
                <optgroup label="内置提供商" class="bg-white dark:bg-zinc-800">
                  <option value="openai">OpenAI</option>
                  <option value="anthropic">Anthropic (Claude)</option>
                </optgroup>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">OpenAI API Key (如果选择了 OpenAI)</label>
              <input id="openaiKey" type="password"
                class="w-full border border-gray-300 dark:border-gray-700 p-2 rounded text-black dark:text-white bg-transparent"
                placeholder="sk-...">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Anthropic API Key (如果选择了 Anthropic)</label>
              <input id="anthropicKey" type="password"
                class="w-full border border-gray-300 dark:border-gray-700 p-2 rounded text-black dark:text-white bg-transparent"
                placeholder="sk-ant-...">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">AI Base URL (接口地址, 可选)</label>
              <input id="aiBaseUrl" type="text"
                class="w-full border border-gray-300 dark:border-gray-700 p-2 rounded text-black dark:text-white bg-transparent"
                placeholder="如 https://api.openai.com/v1">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">AI Model Name (模型名称, 可选)</label>
              <input id="aiModel" type="text"
                class="w-full border border-gray-300 dark:border-gray-700 p-2 rounded text-black dark:text-white bg-transparent"
                placeholder="如 gpt-4o-mini 或 claude-3-5-sonnet-20241022">
            </div>
          </div>
          <button type="submit" id="saveSettingsBtn"
            class="mt-4 w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded transition font-medium">保存设置</button>
        </form>
      </details>

      <!-- 目标仓库 -->
      <form id="generateForm" class="p-4 border rounded-lg shadow-sm bg-white dark:bg-zinc-900 mb-6">
        <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-git-commit-horizontal w-5 h-5 text-blue-500">
            <circle cx="12" cy="12" r="3"></circle>
            <line x1="3" x2="9" y1="12" y2="12"></line>
            <line x1="15" x2="21" y1="12" y2="12"></line>
          </svg>
          目标仓库
        </h2>
        <div class="flex flex-col md:flex-row gap-4 mb-4">
          <div class="flex-1">
            <label class="block text-sm font-medium mb-1">仓库地址 (owner/repo)</label>
            <input id="repoInput" type="text"
              class="w-full border border-gray-300 dark:border-gray-700 p-2 rounded text-black dark:text-white bg-transparent"
              placeholder="例如: yang208115/auto-release" required>
          </div>
          <div class="flex-1">
            <label class="block text-sm font-medium mb-1">Git 标签 或 SHA</label>
            <input id="tagInput" type="text"
              class="w-full border border-gray-300 dark:border-gray-700 p-2 rounded text-black dark:text-white bg-transparent"
              placeholder="例如: v2.2.1 或 main" required>
          </div>
        </div>

        <div class="mt-6"></div>
          <button id="generateBtn" type="submit"
            class="w-full flex justify-center items-center gap-2 bg-green-600 hover:bg-green-700 disabled:bg-gray-400 text-white px-4 py-3 rounded-lg transition font-bold text-lg shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide w-5 h-5">
              <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path>
            </svg>
            <span class="btn-text">生成发布说明</span>
          </button>
          <div class="mt-2 text-center min-h-[1.25rem]">
            <span id="statsLabel" class="text-sm font-normal text-gray-500"></span>
          </div>
        </div>
      </form>

      <!-- 结果展示 -->
      <div class="border rounded-lg shadow-sm bg-white dark:bg-[#0a0a0a] border-gray-200 dark:border-gray-800 flex flex-col">
        <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-zinc-900 rounded-t-lg">
          <h2 class="text-lg font-bold flex items-center gap-2">
            📋 预览与生成结果
          </h2>
          <button id="copyBtn" type="button"
            class="flex items-center justify-center gap-2 bg-zinc-800 hover:bg-zinc-900 disabled:opacity-50 border border-zinc-700 text-white px-3 py-1.5 text-sm rounded transition font-medium">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide w-4 h-4">
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
            </svg>
            复制
          </button>
        </div>
        <div id="markdownOutput"
          class="min-h-[300px] p-6 prose prose-sm sm:prose-base dark:prose-invert prose-headings:font-bold prose-h1:text-2xl prose-h2:text-xl prose-h3:text-lg prose-a:text-blue-500 hover:prose-a:text-blue-600 prose-p:leading-relaxed prose-li:my-1 max-w-none w-full overflow-auto shadow-inner rounded-b-lg">
          <p class="text-gray-500">自动生成的 Release Notes 将在这里展示...</p>
        </div>
      </div>

    </div>
  </main>

  <div id="toast"
    class="fixed bottom-4 right-4 hidden px-4 py-2 rounded shadow-lg text-white font-medium transition-opacity z-50">
  </div>

  <script src="app.js"></script>
</body>

</html>
